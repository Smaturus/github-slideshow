lines:
  label: "Четыре линии · ветви одного рода"
  title: "Кем мы приходимся друг другу"
  lead: "У Сергея и Надежды — четыре родительские линии. Ниже цепочки так, как они записаны в семейном древе."
  branches:
    matyukhin_father:
      tag: "Линия Сергея · по отцу"
      title: "Матюхины"
      paragraphs:
        - >
          Корни в селе <b>Мокрое</b> Белевского уезда Тульской губернии. По архивным
          документам подтверждены родители Андрея — <b>Федот Григорьев</b> и
          <b>Параскева Петрова</b>.
        - >
          В базе он записан как «Федот Матюхин, р. до 1852», но <b>фамилия, дата
          рождения и отождествление с Федотом 1818/1819 года — пока гипотеза</b>:
          карточка не имеет источника, дата вычислена от года рождения сына.
      mini: "Проверить: ревизские сказки и метрики Белевского уезда (ГАТО, Тула)"
    astafyev_mother:
      tag: "Линия Сергея · по матери"
      title: "Астафьевы"
      paragraphs:
        - >
          Линия матери Сергея — <b>Надежды Астафьевой</b> (1931, Дмитров — 1997,
          Долгопрудный). Дед <b>Алексей Астафьев</b>; бабушка <b>Мария Архиповна</b>
          — пока без девичьей фамилии в базе.
      mini: "Цель: девичья фамилия Марии Архиповны и предки Петра Астафьева"
    skiba_father:
      tag: "Линия Надежды · по отцу"
      title: "Скибы"
      paragraphs:
        - >
          Донбасская ветвь: род из села <b>Лозовая Павловка</b> (ныне Луганщина).
          Дед <b>Алексей Скиба</b> (1907, Лозовая Павловка — 1955, Химки), прадед
          <b>Григорий</b> (р. 1879), прапрадед <b>Андрей Скиба</b>. Жена Алексея —
          <b>Маргарита Алексеева</b> (1909, Донецкая обл.) из донбасской ветви Алексеевых.
      mini: "Вглубь: метрики Славяносербского уезда Екатеринославской губернии"
    potashkin_mother:
      tag: "Линия Надежды · по матери"
      title: "Поташкины и Захаровы"
      paragraphs:
        - >
          Бабушка <b>Нина Поташкина</b> (1938, Торопец): отец — <b>Федор Поташкин</b>
          с Валдая, мать — <b>Серафима Алексеева</b> из Чистополя, дочь
          <b>Григория Захарова-Алексеева</b> и <b>Зинаиды Елисеевой</b> из Толкиша.
      mini: "Вглубь: метрики Валдайского уезда (Поташкины) и Чистопольского уезда (Захаровы)"

alekseevs:
  label: "Совпадение фамилий · не путать"
  title: "Две ветви Алексеевых"
  lead: >
    В древе две семьи Алексеевых, между собой не родственные. Обе сходятся в бабушках
    <b>Надежды Скиба</b> — по отцу и по матери.
  tatar:
    tag: "Ветвь I · Татария · из Захаровых"
    title: "Захаровы-Алексеевы"
    paragraphs:
      - >
        <b>Ермил Захаров</b> → <b>Спиридон Ермилович</b> → <b>Григорий Спиридонович</b>
        (1887–1966), записанный как «Захаров/Алексеев».
      - >
        Его дети от <b>Зинаиды Елисеевой</b> (Толкиш) разошлись по фамилиям: старший
        <b>Василий</b> остался Захаровым, младшие — <b>Александр</b>, <b>Серафима</b>,
        <b>Иван</b>, <b>Константин</b> — стали Алексеевыми.
      - >
        <b>Серафима</b> (1912, Чистополь) вышла за Федора Поташкина — она бабушка
        Надежды <b>по матери</b>.
    mini: "Толкиш · Новошешминск · Чистополь (Татария)"
  donbass:
    tag: "Ветвь II · Донбасс · самостоятельный род"
    title: "Алексеевы донбасские"
    paragraphs:
      - >
        <b>Василий Алексеев</b> → <b>Василий Васильевич</b> (1875–1935) и
        <b>Агафья Андреевна</b>; в семье восемь детей.
      - >
        Дочь <b>Маргарита</b> (1909, Донецкая обл. — 1987, Химки) вышла за
        <b>Алексея Скиба</b> — она бабушка Надежды <b>по отцу</b>.
      - >
        С татарскими Алексеевыми родство в документах не прослеживается: разные
        губернии, разные корни, совпадение распространённой фамилии.
    mini: "Донецкая область · Лозовая Павловка · Химки"

