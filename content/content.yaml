surnames:
  label: "Ономастика"
  title: "Фамилии рода"
  lead: "Десять самых частых фамилий в базе; женские формы посчитаны вместе с мужскими."
  default_note: "Фамилия встречается в семейном древе; происхождение уточняется."
  notes:
    Матюхин: >
      Русская фамилия от уменьшительной формы имени Матвей. В селе Мокрое Белевского
      уезда достоверно прослеживается с Андрея Федотовича (р. 1870); принадлежность
      его отца Федота к Матюхиным ещё требует подтверждения.
    Скиба: >
      Украинская фамилия (скиба — «ломоть хлеба»); род из села Лозовая Павловка на
      Донбассе, затем Тула и Химки.
    Захаров: >
      Род из Толкиша (Татария): Ермил → Спиридон → Григорий Спиридонович, который
      писался и Захаровым, и Алексеевым.
    Алексеев: >
      Внимание: в древе две несвязанные ветви Алексеевых — татарская (из Захаровых)
      и донбасская. Обе сходятся в бабушках Надежды Скиба.
    Поташкин: >
      От прозвища «поташник»; корни в деревне Серганиха Валдайского уезда Новгородской губернии.
    Астафьев: "От имени Астафий; линия матери Сергея Матюхина — Дмитров и Долгопрудный."
    Никитин: "Родня по браку; связи в подмосковных записях базы."
    Сахаров: "Родня по браку; связи требуют уточнения по документам."
    Цыганов: "Родня по браку в ветви Поташкиных."
    Игнатьев: "Родня по браку; встречается в ветви Алексеевых."
    Чернов: "Астраханская родня по браку: Черновы жили в Астрахани с конца XIX века."
    Горелов: "Линия прабабушки Марии Гореловой по ветви Матюхиных."
    Алексанов: "Прапрабабушка по линии Матюхиных — Прасковья Алексанова."
    Елисеев: "Зинаида Елисеева из Толкиша — прапрабабушка Надежды по линии Алексеевых."
    Васильев: "Встречается в ветви Алексеевых через брак."
    Букин: "Родня по браку в ветви Алексеевых."
    Успенский: "Родня по браку; ветвь уточняется."
    Яковлев: "Родня по браку в ветви Скиба."

places:
  label: "География"
  title: "Гнёзда рода на карте слов"
  lead: "Места, чаще всего встречающиеся в записях о рождении и смерти."
  default_note: "Место из записей о рождении и смерти в семейной базе."
  notes:
    "город Химки, Московская область": >
      Главное гнездо рода с середины XX века: здесь жили Скибы, здесь поженились
      Сергей и Надежда.
    "село Мокрое Тульской области": >
      Село Белевского уезда Тульской губернии — родовое гнездо Матюхиных с XIX века.
    "село Лозовая Павловка, Донбасс": >
      Село на Луганщине — точка выхода рода Скиба: здесь родились Григорий (1879)
      и Алексей (1907).
    "село Толкиш, Татария": "Село под Чистополем — родина Захаровых-Алексеевых и Елисеевых."
    "город Чистополь, Татария": "Уездный город на Каме; здесь родилась Серафима Алексеева (1912)."
    "село Новошешминск, Татария": "Село Чистопольского уезда; родина братьев Алексеевых."
    "деревня Серганиха, Валдайский уезд, Новгородская губерния": >
      Новгородская губерния — корень Поташкиных: здесь родился Федор (1904).
    "город Валдай, Новгородская губерния": "Новгородская губерния; связанные записи рода Поташкиных."
    "город Дмитров, Московская область": >
      Подмосковье; родина Надежды Астафьевой (1931) и Сергея Матюхина (1971).
    Астрахань: "Город Черновых — родни по браку; жили здесь с конца XIX века."
    Москва: "Столица; сюда сходятся поздние ветви рода."
    "город Солнечногорск, Московская область": >
      Подмосковье; последний адрес Федора Поташкина и Серафимы Алексеевой.
    "город Долгопрудный, Московская область": "Подмосковье; последний адрес Надежды Астафьевой."
    "город Борисоглебск": "Город на Воронежщине; встречается в записях рода."
    "Донецкая область": "Донбасс; родина Маргариты Алексеевой (1909)."
    "город Константиновка, Донецкая область": "Город на Донбассе; встречается в записях рода."

