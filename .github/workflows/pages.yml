name: Publish static site to gh-pages

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: gh-pages-sync
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Force-publish allowlisted files to gh-pages
        run: |
          set -euo pipefail

          test -f index.html
          test -d assets

          PUBLISH_DIR="$(mktemp -d)"
          cp index.html "$PUBLISH_DIR/index.html"
          cp -R assets "$PUBLISH_DIR/assets"
          touch "$PUBLISH_DIR/.nojekyll"

          git checkout --orphan gh-pages-tmp
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx

          cp -R "$PUBLISH_DIR/." .

          git add index.html .nojekyll assets
          git commit -m "Publish static site from ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages
